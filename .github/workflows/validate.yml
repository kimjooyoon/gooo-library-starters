name: Validate Gooo library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install Gooo compiler
        run: go install github.com/kimjooyoon/meta-ontology-go/cmd/gooo@dev
      - name: Check source packages
        run: |
          gooo check core.gooo
          gooo check app.gooo
          gooo package resolve --json gooo.workspace.json
      - name: Execute generated package graph
        run: |
          gooo package execute --json --cases cases.json gooo.workspace.json > execution.json
          jq -e '.decision == "PASS" and .result.runtime.finite_passed == 9 and .result.runtime.finite_total == 9 and .result.runtime.runtime_replayed == true' execution.json
